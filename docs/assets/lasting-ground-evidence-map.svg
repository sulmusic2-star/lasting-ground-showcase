<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Lasting Ground evidence map</title>
  <desc id="desc">A premium evidence map showing public source lanes flowing through scoring, support-depth decisions, visible cautions, and packet output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071813"/><stop offset=".55" stop-color="#10372f"/><stop offset="1" stop-color="#1f635c"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#eaf4ed"/></linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73f7d2" stop-opacity="0"/><stop offset=".5" stop-color="#73f7d2"/><stop offset="1" stop-color="#e9b760"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".30"/></filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0v58" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1400" height="820" rx="48" fill="url(#bg)"/>
  <rect x="30" y="30" width="1340" height="760" rx="38" fill="url(#grid)"/>
  <path d="M156 696C212 630 192 568 242 524C302 470 282 404 342 358C398 316 386 254 446 218C506 180 544 120 608 102" fill="none" stroke="#fffdf6" stroke-opacity=".20" stroke-width="28" stroke-linecap="round"/>
  <path d="M180 688C238 622 220 574 272 532C334 480 318 424 374 382C432 338 426 282 486 244C548 206 572 152 640 116" fill="none" stroke="#9cebd5" stroke-opacity=".36" stroke-width="4" stroke-linecap="round"/>
  <circle cx="374" cy="382" r="14" fill="#e9b760"/><circle cx="486" cy="244" r="10" fill="#73f7d2"/><circle cx="272" cy="532" r="10" fill="#73f7d2"/>
  <g font-family="Inter, Arial" filter="url(#shadow)">
    <g transform="translate(78 86)"><rect width="420" height="226" rx="30" fill="url(#paper)"/><text x="30" y="54" fill="#a96b20" font-size="14" font-weight="950" letter-spacing="4">PUBLIC SOURCE LANES</text><text x="30" y="104" fill="#102018" font-size="34" font-weight="900">place context enters as evidence, not conclusions</text><g transform="translate(30 146)"><rect width="112" height="20" rx="10" fill="#c9f7e9"/><rect x="130" width="88" height="20" rx="10" fill="#ffe5aa"/><rect x="236" width="116" height="20" rx="10" fill="#dfe9ff"/></g></g>
    <g transform="translate(562 148)"><rect width="310" height="168" rx="30" fill="url(#paper)"/><text x="28" y="54" fill="#a96b20" font-size="14" font-weight="950" letter-spacing="4">SCORE</text><text x="28" y="100" fill="#102018" font-size="31" font-weight="900">authority · freshness · support</text><text x="28" y="136" fill="#5d6f63" font-size="19">blockers reduce confidence</text></g>
    <g transform="translate(562 416)"><rect width="310" height="168" rx="30" fill="url(#paper)"/><text x="28" y="54" fill="#a96b20" font-size="14" font-weight="950" letter-spacing="4">DECIDE</text><text x="28" y="100" fill="#102018" font-size="31" font-weight="900">support depth + cautions</text><text x="28" y="136" fill="#5d6f63" font-size="19">uncertainty stays visible</text></g>
    <g transform="translate(966 104)"><rect width="346" height="542" rx="34" fill="url(#paper)"/><text x="34" y="62" fill="#a96b20" font-size="14" font-weight="950" letter-spacing="4">PACKET ARTIFACT</text><text x="34" y="116" fill="#102018" font-size="34" font-weight="900">42 Harbor View Road</text><text x="34" y="154" fill="#5d6f63" font-size="20">source-backed sample packet</text><rect x="34" y="204" width="278" height="54" rx="18" fill="#eef8f1"/><text x="56" y="238" fill="#174f39" font-size="18" font-weight="900">3 validated lanes</text><rect x="34" y="276" width="278" height="54" rx="18" fill="#fff2cf"/><text x="56" y="310" fill="#805817" font-size="18" font-weight="900">2 caution states</text><rect x="34" y="348" width="278" height="54" rx="18" fill="#eef1f6"/><text x="56" y="382" fill="#3d4b59" font-size="18" font-weight="900">source appendix attached</text><path d="M34 458h246M34 494h192" stroke="#c8d5ce" stroke-width="14" stroke-linecap="round"/></g>
  </g>
  <g stroke="url(#lane)" stroke-width="5" stroke-linecap="round" opacity=".95"><path d="M498 198C532 198 538 214 562 232"/><path d="M716 316V416"/><path d="M872 500C930 492 932 386 966 376"/></g>
  <g font-family="Inter, Arial"><circle cx="716" cy="366" r="62" fill="#0b241d" stroke="#73f7d2" stroke-opacity=".55"/><text x="716" y="358" text-anchor="middle" fill="#73f7d2" font-size="17" font-weight="950" letter-spacing="3">CLAIM</text><text x="716" y="386" text-anchor="middle" fill="#fffdf6" font-size="22" font-weight="950">boundary</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Lasting Ground evidence map</title>
  <desc id="desc">A source lane map showing public inputs, evidence scoring, support depth, and packet output.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf1"/><stop offset="1" stop-color="#e4d8c7"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#254f3a"/><stop offset="1" stop-color="#286e6a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#322a1f" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/><g opacity=".10" stroke="#254f3a"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200M120 0V760M240 0V760M360 0V760M480 0V760M600 0V760M720 0V760M840 0V760M960 0V760M1080 0V760"/></g>
  <g font-family="Inter, Arial" filter="url(#shadow)">
    <rect x="72" y="112" width="272" height="476" rx="30" fill="#fffdf8" stroke="#d8cbb9"/><text x="110" y="170" fill="#a87324" font-size="14" font-weight="900" letter-spacing="4">SOURCE LANES</text><text x="110" y="226" fill="#141d18" font-size="28" font-weight="850">GIS context</text><text x="110" y="286" fill="#141d18" font-size="28" font-weight="850">Town zoning</text><text x="110" y="346" fill="#141d18" font-size="28" font-weight="850">Conservation</text><text x="110" y="406" fill="#141d18" font-size="28" font-weight="850">Flood context</text><text x="110" y="466" fill="#141d18" font-size="28" font-weight="850">Permit lane</text>
    <rect x="466" y="156" width="290" height="180" rx="30" fill="#fffdf8" stroke="#d8cbb9"/><text x="500" y="214" fill="#a87324" font-size="14" font-weight="900" letter-spacing="4">SCORE</text><text x="500" y="262" fill="#141d18" font-size="32" font-weight="850">authority · freshness · support</text>
    <rect x="466" y="424" width="290" height="180" rx="30" fill="#fffdf8" stroke="#d8cbb9"/><text x="500" y="482" fill="#a87324" font-size="14" font-weight="900" letter-spacing="4">DECIDE</text><text x="500" y="530" fill="#141d18" font-size="32" font-weight="850">support depth + cautions</text>
    <rect x="858" y="118" width="270" height="470" rx="32" fill="#fffdf8" stroke="#d8cbb9"/><text x="892" y="178" fill="#a87324" font-size="14" font-weight="900" letter-spacing="4">PACKET</text><rect x="892" y="220" width="202" height="28" rx="14" fill="#e7f1e8"/><rect x="892" y="270" width="152" height="18" rx="9" fill="#d8cbb9"/><rect x="892" y="314" width="202" height="18" rx="9" fill="#d8cbb9"/><rect x="892" y="358" width="170" height="18" rx="9" fill="#f2dca8"/><rect x="892" y="402" width="202" height="18" rx="9" fill="#d8cbb9"/><text x="892" y="494" fill="#141d18" font-size="26" font-weight="850">readable artifact</text>
  </g>
  <g stroke="url(#green)" stroke-width="5" stroke-linecap="round" opacity=".76"><path d="M344 350C400 310 424 262 466 246"/><path d="M612 336V424"/><path d="M756 512C814 496 828 398 858 350"/></g>
  <circle cx="610" cy="380" r="58" fill="url(#green)"/><text x="610" y="372" text-anchor="middle" fill="#fffaf1" font-family="Inter, Arial" font-size="20" font-weight="950">source</text><text x="610" y="398" text-anchor="middle" fill="#fffaf1" font-family="Inter, Arial" font-size="20" font-weight="950">boundary</text>

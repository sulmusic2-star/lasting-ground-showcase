name: Lasting Ground examples CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q
      - run: python examples/source_lane_validation.py > /tmp/validation_output.json
      - run: diff -u examples/sample_validation_output.json /tmp/validation_output.json

[project]
name = "lasting-ground-showcase"
version = "0.1.0"
description = "Fictional source-lane validation examples for the Lasting Ground showcase."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest", "coverage"]

[tool.coverage.run]
source = ["examples"]

[tool.coverage.report]
show_missing = true
